; Template. Copy to ../export_presets.cfg (git-ignored) after installing the
; Godot 4.7.1 export templates and the Android SDK, then set the keystore values
; via Godot's editor settings or environment variables.
; preset.1 (debug APK, no Gradle) was built and verified on 2026-09-25 with the
; Ubuntu android-sdk-build-tools/adb packages (see docs/RELEASE.md).
; preset.0 (release AAB, Gradle) is still unverified.


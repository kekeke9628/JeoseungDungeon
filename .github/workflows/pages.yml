# Builds the web version and publishes it to GitHub Pages on every push to
# master, so the latest game is always playable in a phone browser at
# https://kekeke9628.github.io/JeoseungDungeon/
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Web build to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.1"  # keep in step with README.md and .claude/hooks/session-start.sh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the web export template
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Install Godot and the web export template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 4 -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL --retry 4 -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Put Godot on the PATH
        run: |
          mkdir -p ~/godot/bin
          ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/bin/godot
          echo "$HOME/godot/bin" >> "$GITHUB_PATH"

      - name: Import assets
        run: godot --headless --path . --import

      - name: Smoke test
        run: godot --headless --path . res://tests/SmokeTest.tscn

      - name: Export the web build
        run: |
          cp export/export_presets.template.cfg export_presets.cfg
          mkdir -p build/web
          touch build/.gdignore  # keep Godot from importing its own export output
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck

      - name: Check the exported data loads
        run: |
          godot --headless --path . --export-pack "Web" /tmp/game.pck
          godot --headless --main-pack /tmp/game.pck -s "$PWD/tests/export_check.gd"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
